[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-odin"
version = "1.1.0"
description = "From churn risk to profitable retention decisions: budget-constrained customer selection with 0/1 Knapsack optimisation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afrooz Mohandesian" }]
keywords = ["churn", "customer-retention", "knapsack", "optimization", "analytics", "clv"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=7.4", "ruff>=0.4", "jupyter", "nbconvert", "streamlit>=1.36"]

[project.scripts]
odin = "odin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Notebook source cells and Markdown are embedded as long string literals.
"scripts/build_report_notebook.py" = ["E501"]
